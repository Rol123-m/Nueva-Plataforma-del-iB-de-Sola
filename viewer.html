<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor de clase — Instituto Bíblico</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAF6EE; }
      .bar {
        position: sticky; top: 0; z-index: 10;
        background: rgba(15, 30, 61, 0.96);
        backdrop-filter: blur(12px);
        color: #F7F2E8;
        padding: 14px 24px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        border-bottom: 1px solid rgba(212, 178, 90, 0.18);
      }
      .bar .lhs { display: flex; align-items: center; gap: 14px; }
      .bar .badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: #D4B25A;
        background: rgba(212, 178, 90, 0.15);
        padding: 4px 10px; border-radius: 6px;
      }
      .bar .title {
        font-family: Georgia, serif; font-size: 1.05rem; font-weight: 500;
      }
      .bar a {
        color: #D4B25A; text-decoration: none; font-size: 0.85rem; font-weight: 500;
        padding: 7px 14px; border: 1px solid rgba(212, 178, 90, 0.3); border-radius: 999px;
        transition: background 0.2s;
      }
      .bar a:hover { background: rgba(212, 178, 90, 0.1); }
      .frame-wrap { padding: 16px; }
      iframe {
        width: 100%; height: calc(100vh - 110px);
        border: 1px solid rgba(15, 30, 61, 0.08);
        border-radius: 12px; background: white;
        box-shadow: 0 6px 18px rgba(26, 22, 20, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="lhs">
        <span class="badge">Material de clase</span>
        <span class="title" id="title">Cargando…</span>
      </div>
      <a href="javascript:history.back()">← Volver</a>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" src="" title="Material de clase"></iframe>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      const title = params.get('title') || 'Material de clase';
      document.getElementById('title').textContent = decodeURIComponent(title);
      if (url) {
        document.getElementById('frame').src = decodeURIComponent(url);
      }
    </script>
  </body>
</html>
